<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreshBasket | Login</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-secondary);
      margin: 0;
      position: relative;
    }

    .auth-toggles {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
    }

    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 50px;
      border-radius: var(--radius-lg);
      box-shadow: 0 10px 30px var(--shadow);
      width: 100%;
      max-width: 450px;
      text-align: center;
      margin: 40px 0;
    }

    .auth-logo {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      margin-bottom: 30px;
    }

    .auth-logo .logo-icon {
      background: var(--color-primary);
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-family: var(--font-heading);
      font-size: 20px;
      margin-right: 10px;
    }

    .auth-logo .logo-text {
      font-family: var(--font-heading);
      font-size: 24px;
      color: var(--text-primary);
      font-weight: 700;
    }

    .auth-logo .logo-text span {
      color: var(--color-primary);
    }

    .password-container {
      position: relative;
    }

    .password-toggle {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      font-size: 14px;
      text-align: left;
    }

    .auth-options label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .auth-options a {
      color: var(--color-primary);
      text-decoration: none;
      font-weight: 500;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      margin: 25px 0;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .auth-divider::before {
      margin-right: 15px;
    }

    .auth-divider::after {
      margin-left: 15px;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--card-bg);
      color: var(--text-primary);
      font-family: var(--font-ui);
      font-weight: 500;
      cursor: pointer;
      transition: var(--trans);
    }

    .social-btn:hover {
      background: var(--bg-secondary);
    }

    .auth-options a:hover {
      text-decoration: underline !important;
    }

    .auth-card p a:hover {
      text-decoration: underline !important;
    }
  </style>

</head>

<body>

  <!-- Toggles at Top Right -->
  <div class="auth-toggles">
    <button class="icon-btn mode-toggle-btn" aria-label="Toggle theme" title="Dark mode">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" style="display: block; margin: auto;">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
    <button class="icon-btn rtl-toggle-btn" aria-label="Toggle RTL" title="RTL mode">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" style="display: block; margin: auto;">
        <line x1="21" y1="10" x2="7" y2="10"></line>
        <line x1="21" y1="6" x2="3" y2="6"></line>
        <line x1="21" y1="14" x2="7" y2="14"></line>
        <line x1="21" y1="18" x2="3" y2="18"></line>
      </svg>
    </button>
  </div>

  <div class="auth-card reveal">
    <a href="index.html" class="logo-link" aria-label="FreshBasket Home"
      style="margin-bottom: 30px; display: inline-flex;">
      <div class="logo-icon">F</div>
      <span class="logo-text">Fresh<span>Basket</span></span>
    </a>

    <h4 style="margin-bottom: 10px;">Welcome Back</h4>
    <p style="color: var(--text-secondary); margin-bottom: 30px;">Enter your credentials to access your account.</p>

    <form action="#" method="POST" style="text-align: left;">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-control" placeholder="john@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="password-container">
          <input type="password" id="password-input" class="form-control" placeholder="••••••••" required>
          <div class="password-toggle" id="toggle-password">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </div>
        </div>
      </div>

      <div class="auth-options">
        <label><input type="checkbox"> Remember me</label>
        <a href="#">Forgot Password?</a>
      </div>

      <button type="submit" class="btn-premium btn-primary"
        style="width: 100%; justify-content: center; height: 50px;">Sign In</button>
    </form>

    <div class="auth-divider">OR</div>

    <button class="social-btn">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path
          d="M12.24 10.285V14.4h6.806c-.275 1.765-2.056 5.174-6.806 5.174-4.095 0-7.439-3.389-7.439-7.574s3.345-7.574 7.439-7.574c2.33 0 3.891.989 4.785 1.849l3.254-3.138C18.189 1.186 15.479 0 12.24 0c-6.635 0-12 5.365-12 12s5.365 12 12 12c6.926 0 11.52-4.869 11.52-11.726 0-.788-.085-1.39-.189-1.989H12.24z" />
      </svg>
      Continue with Google
    </button>
    <button class="social-btn">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path
          d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.09 2.31-.83 3.61-.71 1.54.12 2.68.74 3.42 1.83-2.9 1.76-2.43 5.48.51 6.64-.69 1.8-1.57 3.36-2.62 4.41zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z" />
      </svg>
      Continue with Apple
    </button>

    <p style="margin-top: 30px; color: var(--text-secondary); font-size: 14px;">
      Don't have an account? <a href="register.html"
        style="color: var(--color-primary); font-weight: bold; text-decoration: none;">Sign Up</a>
    </p>
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    // Password toggle logic
    const togglePassword = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password-input');

    if (togglePassword && passwordInput) {
      togglePassword.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);

        if (type === 'text') {
          togglePassword.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
        } else {
          togglePassword.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
        }
      });
    }
  </script>
</body>

</html>
